[project]
name = "luxe-ai-shopping-assistant"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["Frontend"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008", "B904", "B905"]
